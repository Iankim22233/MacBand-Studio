name: MacBandStudioiOS
options:
  bundleIdPrefix: com.macband
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
targets:
  MacBandStudio:
    type: application
    platform: iOS
    # The code shared with the Mac app lives in ../Sources/MacBandStudio; iOS-only code is in Sources.
    sources:
      - path: ../Sources/MacBandStudio
        excludes:
          # Mac only
          - main.swift
          - App.swift
          - SessionPlatformMac.swift
          - PluginHost.swift
          - VST3Support.swift
          - PluginManagerView.swift
          - DemoMode.swift
          - StressTest.swift
          - SelfTest.swift
          - UITest.swift
          - "*Test.swift"
          - WaveBench.swift
          # AppKit views, ported one by one (see Sources/)
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macband.studio.ios
        PRODUCT_NAME: MacBand Studio
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: MacBand Studio
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "MacBand Studio records vocals and other audio from your microphone."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "MacBand Studio transcribes sung vocals so the words can be shown on the tuned notes."
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UIStatusBarHidden: NO
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.macband.project
            UTTypeDescription: MacBand Project
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [macband]
        CFBundleDocumentTypes:
          - CFBundleTypeName: MacBand Project
            CFBundleTypeRole: Editor
            LSItemContentTypes: [com.macband.project]
          - CFBundleTypeName: MIDI File
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [public.midi-audio]
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [public.audio]
